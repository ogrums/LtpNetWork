plugins {
    id 'com.android.library'
//    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-platform-android'
    id 'kotlin-parcelize'

}

android {
    namespace 'com.letianpai.network'
    compileSdk 32

    defaultConfig {
//        applicationId "com.letianpai.network"
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}
ext {
    // Sdk and tools
    // Support library and architecture components support minSdk 14 and above.
    kotlin_version = '1.7.0'
    hilt_version ='2.44'
    minSdkVersion = 23
    targetSdkVersion = 32
    compileSdkVersion = 33
    buildToolsVersion = "30.0.3"
    retrofitVersion = '2.9.0'
    moshiVersion = '1.14.0'
    okhttpInterceptorVersion = '4.9.0'
    annotationVersion ='1.1.0'
    livedata_ktx='2.3.0'
}
dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    //kotlin
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    api "androidx.annotation:annotation:$annotationVersion"
    api "androidx.lifecycle:lifecycle-livedata-ktx:$livedata_ktx"

    // retrofit
    api "com.squareup.retrofit2:converter-moshi:$retrofitVersion"
    api "com.squareup.moshi:moshi:$moshiVersion"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:$moshiVersion"
    api "com.squareup.okhttp3:logging-interceptor:$okhttpInterceptorVersion"

    //集成xlog
    api 'com.elvishew:xlog:1.10.1'

    implementation('com.qiniu:qiniu-android-sdk:8.6.+') {
        exclude(group: 'com.squareup.okhttp3', module: 'okhttp')
    }

    implementation 'com.amazonaws:aws-android-sdk-s3:2.73.0'
    implementation('com.amazonaws:aws-android-sdk-mobile-client:2.6.+@aar') { transitive = true }
    implementation 'com.amazonaws:aws-android-sdk-s3:2.73.0'
    implementation 'com.amazonaws:aws-android-sdk-cognito:2.6.17'
    implementation 'com.amazonaws:aws-android-sdk-core:2.73.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

